[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-text2sql"
version = "0.2.0"
description = "A universal, agentic Natural Language to SQL system that works against any database — auto schema discovery, auto knowledge graph, auto business glossary."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Subrata Samanta" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "groq>=0.11.0",
    "networkx>=3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
]
# Stronger, AST-based SQL statement classification for the read-only safety
# guardrail (universal_text2sql.database.safety). Optional: the zero-dependency
# regex baseline is always active; sqlglot adds robustness against CTE-wrapped
# writes and similar cases the regex baseline can't fully see.
safety = [
    "sqlglot>=25.0.0",
]

[project.urls]
Homepage = "https://github.com/subrata-samanta/universal-text2sql"
Issues = "https://github.com/subrata-samanta/universal-text2sql/issues"
Changelog = "https://github.com/subrata-samanta/universal-text2sql/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_text2sql*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length is enforced via formatter/reviewer judgement, not a hard failure
]

[tool.ruff.lint.per-file-ignores]
# main.py/app.py intentionally call load_dotenv()/st.set_page_config() before
# importing project modules that read env vars / must run first at import time.
"main.py" = ["E402"]
"app.py" = ["E402"]
# Blind `pytest.raises(Exception)` is an accepted idiom for "raises something" tests.
"tests/*" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["universal_text2sql"]
